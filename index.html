<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เช็คชื่อ & คะแนน</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--hdr:#ffffff;--bg:#f4f6f8;--card:#fff;--ink:#1c2733;--mut:#6b7785;--line:#dde3ea;--head:#eef2f6;--soft:#f7f9fb;--pri:#1f6feb;--ok:#1a8f4c;--late:#c77700;--leave:#2b7bbb;--abs:#d0342c;--act:#7a4cc2;--cpre:#e8f1ff;--cmid:#fff3d6;--cpost:#e6f6ec;--cfin:#fde8e6;--dan:#f0c2bf}
[data-theme=dark]{color-scheme:dark;--hdr:#222b36;--bg:#12171d;--card:#1b222b;--ink:#e6ebf1;--mut:#97a3b1;--line:#2f3a47;--head:#232c37;--soft:#202833;--pri:#4d8ff5;--ok:#2aa862;--late:#d68a1a;--leave:#3f93d6;--abs:#e3554d;--act:#9a72dd;--cpre:#1d2c45;--cmid:#3d3214;--cpost:#17362a;--cfin:#412321;--dan:#6b2f2b}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
#app{max-width:980px;margin:0 auto;padding:12px 12px 84px}
h1{font-size:1.3rem;margin:.2em 0 .6em}h2{font-size:1.15rem;margin:.4em 0 .6em}h3{font-size:1rem;margin:.8em 0 .4em}
small,.mut{color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer;min-height:40px}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:600}
.btn.dan{color:var(--abs);border-color:var(--dan)}
.btn.sm{padding:4px 9px;min-height:32px;font-size:.9rem}
.btn:disabled{opacity:.5}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--card);color:var(--ink);max-width:100%}
input.full,select.full,textarea.full{width:100%}
label{display:block;font-size:.9rem;color:var(--mut);margin:8px 0 3px}
.big{font-size:1.5rem;font-weight:700}
.center{text-align:center}
.hero{padding:26px 12px;border-radius:16px;color:#fff;text-align:center;margin-bottom:10px}
.hero .ic{font-size:3.2rem;line-height:1}
.st-มา{background:var(--ok)}.st-สาย{background:var(--late)}.st-ลา{background:var(--leave)}.st-ขาด{background:var(--abs)}.st-กิจกรรม{background:var(--act)}
.chip{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 0;width:44px;text-align:center;cursor:pointer;font-size:.85rem;color:var(--mut)}
.chip.on{color:#fff;border-color:transparent;font-weight:700}
.chip.st-มา{background:var(--ok)}.chip.st-สาย{background:var(--late)}.chip.st-ลา{background:var(--leave)}.chip.st-ขาด{background:var(--abs)}.chip.st-กิจกรรม{background:var(--act)}
.chip.pend{background:var(--cmid);color:var(--ink);border-color:var(--late);font-weight:700}
.pend{background:var(--cmid);border-radius:5px;padding:0 5px}
.stu{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
.stu:last-child{border-bottom:0}.stu .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stu .no{width:26px;color:var(--mut);text-align:right;font-size:.9rem}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--card);max-height:72vh}
table{border-collapse:collapse;font-size:.88rem;width:max-content;min-width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--head);z-index:2;font-weight:600}
td.nm,th.nm{position:sticky;left:0;background:var(--card);text-align:left;z-index:1;max-width:150px;overflow:hidden;text-overflow:ellipsis}
thead th.nm{z-index:3;background:var(--head)}
td.tap,th.tap{cursor:pointer}
.c-pre{background:var(--cpre)}.c-mid{background:var(--cmid)}.c-post{background:var(--cpost)}.c-final{background:var(--cfin)}
.a{display:inline-block;min-width:22px;border-radius:5px;color:#fff;font-weight:700;padding:0 4px}
.warn{color:var(--abs);font-weight:700}
nav.menu{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:20}
nav.menu button{flex:1;font:inherit;font-size:.78rem;border:0;background:none;padding:7px 2px 10px;color:var(--mut);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
nav.menu button.on{color:var(--pri);font-weight:700}
#hdr{position:sticky;top:0;z-index:30;background:var(--hdr);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.07)}
#hdr:empty{display:none}
.hin{max-width:980px;margin:0 auto;padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{display:block;font-size:1.05rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand small{display:block;color:var(--mut);font-size:.8rem;line-height:1.3}
.logo{width:40px;height:40px;border-radius:11px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;font-weight:700}
.hbtn{width:44px;height:44px;border-radius:11px;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;padding:0}
.hlive{font:inherit;display:flex;align-items:center;gap:8px;border:1px solid var(--ok);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;min-height:40px}
.hlive i{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.hlive span{color:var(--mut);font-size:.85rem}
@media(max-width:599px){.hlive{order:3;flex:1 1 100%;justify-content:flex-start}.hlive span{margin-left:auto}}
.shell{display:block}.main{min-width:0}
body.mode-S #app,body.mode-S .hin{max-width:640px}
@media(min-width:900px){
  body.mode-T #app,body.mode-T .hin{max-width:1320px}
  body.mode-T #app{padding:16px 20px 30px}
  .shell{display:flex;gap:18px;align-items:flex-start}.main{flex:1}
  nav.menu{position:sticky;top:80px;flex-direction:column;width:200px;flex:none;border:1px solid var(--line);border-radius:12px;padding:6px;gap:2px;z-index:5}
  nav.menu button{flex-direction:row;justify-content:flex-start;gap:10px;font-size:.95rem;padding:10px 12px;color:var(--ink)}
  nav.menu button.on{background:var(--soft);color:var(--pri)}
  #toast{bottom:30px}
}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 10px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;min-height:44px}
.kpi small{display:block;color:var(--mut);font-size:.85rem}.kpi b{display:block;font-size:1.65rem;line-height:1.25}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:0 14px}.cols>div{min-width:0}
@media(min-width:900px){.cols{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}}
.sbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);margin:6px 0 4px}.sbar i{display:block;height:100%}
.k-s{background:var(--ok)}.k-l{background:var(--late)}.k-w{background:var(--act)}.k-m{background:var(--abs)}.k-z{background:var(--mut)}.k-o{background:var(--line)}
.leg{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.82rem;color:var(--mut)}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}.seg button{font:inherit;border:0;background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer;min-height:40px}.seg button.on{background:var(--pri);color:#fff;font-weight:700}
.hm td{padding:2px;min-width:40px}.hm .c{display:block;border-radius:5px;height:26px;line-height:26px;font-size:.75rem;font-weight:700;color:#fff}.hm .c.k-o{background:var(--soft);color:var(--mut)}
.ring{flex:none}
.task{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--soft)}
.tlink{font:inherit;font-size:1.05rem;font-weight:700;color:var(--ink);background:none;border:0;padding:0;text-align:left;cursor:pointer;min-height:32px;line-height:1.3}
.tlink:hover{color:var(--pri)}
.hm th.hmh{white-space:normal;min-width:70px;max-width:96px;font-size:.76rem;line-height:1.25;vertical-align:bottom}
.tt th.brk,.tt td.brk{background:var(--soft);color:var(--mut);font-size:.8rem;min-width:64px;width:64px;white-space:normal;line-height:1.3}
.ordr{display:flex;align-items:center;gap:8px;padding:4px 6px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:var(--card)}
.ordr.drag{border-color:var(--pri);box-shadow:0 6px 16px rgba(0,0,0,.2);background:var(--soft)}
.hdl{touch-action:none;cursor:grab;padding:10px;font-size:1.1rem;color:var(--mut);user-select:none;-webkit-user-select:none;line-height:1}
.badge{display:inline-block;font-size:.72rem;padding:1px 7px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--mut);vertical-align:1px}
.nmlink{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}.nmlink:hover{color:var(--pri);text-decoration:underline}
#saved{position:fixed;top:72px;right:14px;z-index:70;display:none;align-items:center;gap:6px;background:var(--ok);color:#fff;font-weight:700;padding:7px 14px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
#saved.on{display:flex;animation:pop .25s ease-out}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.busy{opacity:.55;pointer-events:none;cursor:progress}
.arr{width:44px;height:44px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:10px}
.arr svg{width:24px;height:24px}
.lvw{border:1px solid var(--abs);background:var(--cfin);border-radius:10px;padding:8px 10px;margin:8px 0}
.chipl{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;padding:2px 8px;border-radius:999px;color:#fff;font-weight:700}
.duep{font-size:.82rem;color:var(--mut)}.duep.over{color:var(--abs);font-weight:700}.duep.soon{color:var(--late);font-weight:600}
h2{margin:.1em 0 .5em}
#bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--pri);z-index:50;display:none;animation:ld 1s infinite alternate}
@keyframes ld{from{opacity:.25}to{opacity:1}}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:16px 16px 0 0;padding:16px;width:100%;max-width:520px;max-height:86vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;display:none;z-index:60;max-width:90%;text-align:center}
.tt td{height:52px;min-width:86px;white-space:normal}.tt td.has{background:var(--cpre);font-weight:600}
.tt tbody th{position:sticky;left:0;background:var(--head);z-index:1}
.rate{display:flex;gap:6px}.rate button{flex:1}
.rate button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.bar2{height:8px;background:var(--line);border-radius:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--ok)}
details summary{cursor:pointer;font-weight:600}
.scin{width:74px;text-align:center}
.th{width:58px;height:58px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--soft)}
.ths{display:flex;gap:6px;flex-wrap:wrap;width:100%;margin-top:6px;align-items:center}
.thw{position:relative}.thw .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--abs);color:#fff;font-size:.75rem;cursor:pointer;padding:0}
.qimg{max-width:100%;max-height:280px;border-radius:10px;display:block;margin:8px 0;background:#fff}
.opt{display:flex;gap:8px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer;color:var(--ink);font-size:1rem}
.opt input{margin-top:4px}
.qtime{position:sticky;top:0;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.ok{color:var(--ok);font-weight:700}.ng{color:var(--abs);font-weight:700}
.qcard textarea{min-height:60px}
pre.prompt{white-space:pre-wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.88rem;max-height:220px;overflow:auto}
.stum{color:var(--ok);font-size:.75rem;margin-left:2px}.stum.dirty{color:var(--late)}.stum.err{color:var(--abs);font-weight:700}
.trsel{min-width:52px;padding:4px}.trsel.chg{outline:2px solid var(--late);outline-offset:-1px}
</style>
</head>
<body>
<div id="bar"></div>
<header id="hdr"></header>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="saved" role="status" aria-live="polite"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>บันทึกแล้ว</div>
<script>
/* ====== ตั้งค่า: วาง URL ของ Apps Script Web app (ลงท้าย /exec) ตรงนี้ ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyJWscvDfAl1IUnkgrwo225EqopTIXb0z7K3SHP2_AO06rUlwnc6LMDkF92a0nYVTvi/exec';

const ST = ['มา','สาย','ลา','ขาด','กิจกรรม'];
const STL = {'มา':'ม','สาย':'ส','ลา':'ล','ขาด':'ข','กิจกรรม':'ก'};
const CATS = ['pre','mid','post','final'];
const CATN = {pre:'ก่อนกลางภาค',mid:'กลางภาค',post:'หลังกลางภาค',final:'ปลายภาค'};
const CATS_S = {pre:'ก่อน',mid:'กลาง',post:'หลัง',final:'ปลาย'};
const DAYS = ['','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์','อาทิตย์'];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mem = {};
const LS = {
  get(k){ try { const v = localStorage.getItem('gb_'+k); return v == null ? (mem[k] || null) : v; } catch(e){ return mem[k] || null; } },
  set(k,v){ if (v == null) delete mem[k]; else mem[k] = v; try { v == null ? localStorage.removeItem('gb_'+k) : localStorage.setItem('gb_'+k, v); } catch(e){} }
};
const rnd = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
const fmtD = d => d ? d.slice(8,10) + '/' + d.slice(5,7) : '';
const perTxt = x => +x.span === 2 ? (+x.period) + '–' + (+x.period + 1) : String(x.period || '-');
const MODE = /teacher/.test(location.hash + location.search) ? 'T' : 'S';

let busyN = 0;
function busy(d){ busyN = Math.max(0, busyN + d); $('#bar').style.display = busyN ? 'block' : 'none'; }
const READS = new Set(['tStumisInfo', 'tStumisTest', 'tTraitGrid', 'sLookup', 'sInit', 'sScores', 'sImg', 'tImg', 'tLogin', 'tBoot', 'tDash', 'tLive', 'tAttGrid', 'tScoreGrid', 'tLog', 'tQuizList', 'tQuizResults', 'tStudent', 'sQuizStart', 'sQuizLeave']);
let savedT;
function savedFlash(){ const el = document.getElementById('saved'); if (!el) return; const hb = document.getElementById('hdr'); el.style.top = Math.max(8, (hb ? hb.getBoundingClientRect().bottom : 60) + 8) + 'px'; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); clearTimeout(savedT); savedT = setTimeout(() => el.classList.remove('on'), 1600); }
const MS = () => +((T.boot && T.boot.cfg.msPct) || 80), RP = () => +((T.boot && T.boot.cfg.rPct) || 80);
async function api(a, p, quiet){
  if (!quiet) busy(1);
  try {
    const r = await fetch(API_URL, { method:'POST', body: JSON.stringify({ a:a, p:p || {} }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'เกิดข้อผิดพลาด');
    if (!quiet && !READS.has(a) && !(p && p.dry)) savedFlash();
    return j.data;
  } finally { if (!quiet) busy(-1); }
}
const tapi = (a, p, quiet) => api(a, Object.assign({ t: LS.get('tt') }, p || {}), quiet);
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 2600); }
function modal(html){ const m = $('#modal'); m.innerHTML = '<div class="box">' + html + '</div>'; m.classList.add('on'); setTimeout(loadImgs, 0); }
let askRes = null, askOpt = {};
function mclose(){ const m = $('#modal'); m.classList.remove('on'); m.innerHTML = ''; if (askRes) { const r = askRes; askRes = null; r(false); } }
function ask(msg, opt){
  mclose(); askOpt = opt || {};
  return new Promise(res => { askRes = res;
    modal(`<h3>${esc(askOpt.title || 'ยืนยัน')}</h3><p>${esc(msg)}</p>${askOpt.pass ? '<label>ใส่รหัสผ่านครูเพื่อยืนยันการลบ</label><input class="full" id="askP" type="password" autocomplete="off">' : ''}
    <p class="wrap"><button class="btn ${askOpt.danger ? 'dan' : 'pri'}" data-act="askY">${esc(askOpt.yes || 'ยืนยัน')}</button><button class="btn" data-act="mclose">ยกเลิก</button></p>`); });
}
const IMG = {}, IMGP = {}, BLANK = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function loadImgs(){
  document.querySelectorAll('img[data-fid]').forEach(el => {
    const id = el.dataset.fid; if (el.dataset.ld) return; el.dataset.ld = '1';
    if (IMG[id]) { el.src = IMG[id]; return; }
    el.src = BLANK;
    IMGP[id] = IMGP[id] || (MODE === 'T' ? tapi('tImg', { fileId: id }, true) : api('sImg', { token: LS.get('tok'), fileId: id }, true))
      .then(u => { IMG[id] = u; document.querySelectorAll(`img[data-fid="${id}"]`).forEach(x => x.src = u); }).catch(() => { delete IMGP[id]; });
  });
}
async function readImg(file){
  if (!file) throw new Error('ยังไม่ได้เลือกรูป');
  if (!/^image\//.test(file.type)) throw new Error('เลือกไฟล์รูปเท่านั้น');
  let out = null;
  if (window.createImageBitmap) { try {
    const b = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(b.width, b.height)), c = document.createElement('canvas');
    c.width = Math.round(b.width * k); c.height = Math.round(b.height * k); const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(b, 0, 0, c.width, c.height);
    out = c.toDataURL('image/jpeg', 0.8); } catch(e){ out = null; } }
  if (!out) out = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('อ่านไฟล์ไม่ได้')); r.readAsDataURL(file); });
  if (out.length > 2800000) throw new Error('รูปใหญ่เกินไป ลองถ่ายใหม่หรือครอปให้เล็กลง');
  return out;
}

function pTimes(){
  const c = T.boot.cfg, P = +c.periods || 9, len = +c.periodMin || 50, br = +c.breakAfter || 0, bm = +c.breakMin || 0;
  const m0 = String(c.dayStart || '08:30').split(':'); let t = (+m0[0] || 0) * 60 + (+m0[1] || 0);
  const f = x => String(Math.floor(x / 60) % 24).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'), out = [];
  for (let p = 1; p <= P; p++) { out.push(f(t) + '-' + f(t + len)); t += len; if (br && p === br) t += bm; }
  return out;
}
const pTime = (p, span) => { const t = pTimes(), a = (t[p - 1] || '').split('-')[0], b = (t[p - 1 + (+span === 2 ? 1 : 0)] || '').split('-')[1]; return a && b ? a + '–' + b : ''; };
function vTT(){
  const b = T.boot, P = +b.cfg.periods || 9, m = {};

  <p class="mut">แตะช่อง = ใส่/แก้วิชา · เวลาแต่ละคาบคำนวณให้อัตโนมัติ${+c.breakAfter ? ' · คาบคู่จะไม่ข้ามช่วงพัก' : ''}</p><div class="tbl"><table class="tt"><thead><tr><th>วัน</th>`;
  const br = +c.breakAfter || 0, brT = br && br < P ? (pTimes()[br - 1] || '').split('-')[1] + '–' + (pTimes()[br] || '').split('-')[0] : '';
  for (let p = 1; p <= P; p++) { h += `<th class="tap" data-act="ptime">คาบ ${p}<br><small>${esc(pTime(p, 1))}</small></th>`; if (p === br && p < P) h += `<th class="brk tap" data-act="ptime">พัก<br><small>${esc(brT)}</small></th>`; }
  h += '</tr></thead><tbody>';
  for (let d = 1; d <= 5; d++) { h += `<tr><th>${DAYS[d]}</th>`;
    for (let p = 1; p <= P; p++) { const x = m[d + '|' + p], g = x && grp(x.groupId);
      if (g) { const two = +x.span === 2 && p < P && p !== br && !(m[d + '|' + (p + 1)] && grp(m[d + '|' + (p + 1)].groupId));
        h += `<td class="tap has" ${two ? 'colspan="2"' : ''} data-act="ttCell" data-d="${d}" data-p="${p}">${esc(g.label)}<br><small>${esc((subj(g.subjectId) || {}).name || '')}${+x.span === 2 ? ' · คาบคู่' : ''}</small></td>`;
        if (two) p++; }
      else h += `<td class="tap" data-act="ttCell" data-d="${d}" data-p="${p}"></td>`;
      if (p === br && p < P && d === 1) h += `<td class="brk" rowspan="5">พัก<br>กลางวัน</td>`; }
    h += '</tr>'; }
  h += `</tbody></table></div><p class="wrap"><button class="btn sm" data-act="pCount" data-d="1">+ เพิ่มคาบ</button><button class="btn sm" data-act="pCount" data-d="-1">− ลดคาบ</button><small>ตอนนี้ ${P} คาบ/วัน</small></p>`;
  h += '<h3>สรุปคาบต่อสัปดาห์</h3><div class="card">' + (b.groups.map(g => `<div class="stu"><span class="nm">${esc(g.label)} <small>${esc((subj(g.subjectId) || {}).name || '')}</small></span><span>${b.timetable.filter(x => x.groupId === g.groupId).reduce((a, x) => a + (+x.span === 2 ? 2 : 1), 0)} คาบ</span></div>`).join('') || NOGRP) + '</div>';
  return h;
}

  copyAttGo: d => { const g = grp(T.gid), studs = stuOf(g), ss = T.att.sessions, by = {}; T.att.att.forEach(a => (by[a.studentId] = by[a.studentId] || {})[a.sessionId] = a);

    const head = ['เลขที่', 'ชื่อ'].concat(ss.map(se => fmtD(se.date) + ' ค.' + se.period), ['มา%'], ST);

  hideAll: d => run(async () => { const sid = grp(T.gid).subjectId; await tapi('tItemHide', { subjectId: sid, hide: d.h === '1' });
    T.boot.items.forEach(i => { if (i.subjectId === sid) i.hide = d.h; }); toast(d.h === '1' ? 'ซ่อนคะแนนแล้ว (นักเรียนยังเห็นสถานะส่ง)' : 'นักเรียนเห็นคะแนนแล้ว'); draw(); }),
  hide1: () => run(async () => { const it = T.boot.items.find(i => i.itemId === T.item), h = it.hide !== '1'; await tapi('tItemHide', { itemId: it.itemId, hide: h }); it.hide = h ? '1' : '0'; toast(h ? 'ซ่อนคะแนนช่องนี้แล้ว' : 'ประกาศคะแนนแล้ว'); draw(); }),
  pendAll: () => run(async () => { const list = pendList().map(x => ({ itemId: x.itemId, studentId: x.studentId, sub: 'ส่ง' }));
    await tapi('tSetScores', { list }); list.forEach(e => T.sg.map[e.itemId + '|' + e.studentId].sub = 'ส่ง'); toast('ยืนยัน ' + list.length + ' รายการ'); draw(); }),
  ptime: () => { const c = T.boot.cfg, P = +c.periods || 9, st = String(c.dayStart || '08:30').split(':');
    const opt = (arr, cur, f) => arr.map(v => `<option value="${v}" ${String(v) === String(cur) ? 'selected' : ''}>${f ? f(v) : v}</option>`).join('');
    const r5 = (a, b) => { const o = []; for (let v = a; v <= b; v += 5) o.push(v); return o; };
    modal(`<h3>ตั้งเวลาคาบ</h3><p class="mut" style="margin-top:0">ปรับทีละ 5 นาที เวลาของทุกคาบคำนวณให้เอง</p>
    <div class="wrap"><div><label>เริ่มคาบแรก</label><span class="wrap" style="gap:4px"><select id="pH" aria-label="ชั่วโมง">${opt([6,7,8,9,10,11,12,13], +st[0], v => String(v).padStart(2, '0'))}</select>:<select id="pMi" aria-label="นาที">${opt(r5(0, 55), +st[1], v => String(v).padStart(2, '0'))}</select></span></div>
    <div><label>นาทีต่อคาบ</label><select id="pL">${opt(r5(20, 120), +c.periodMin || 50)}</select></div>
    <div><label>จำนวนคาบ/วัน</label><select id="pN">${opt(Array.from({ length: 15 }, (_, i) => i + 1), P)}</select></div></div>
    <div class="wrap"><div><label>พักกลางวัน</label><select id="pB"><option value="">ไม่มี</option>${Array.from({ length: P - 1 }, (_, i) => `<option value="${i + 1}" ${+c.breakAfter === i + 1 ? 'selected' : ''}>หลังคาบ ${i + 1}</option>`).join('')}</select></div>
    <div><label>พักกี่นาที</label><select id="pM">${opt(r5(5, 120), +c.breakMin || 60)}</select></div></div>
    <p class="mut">นาทีต่อคาบใช้ตัดสินเวลาปิดคาบอัตโนมัติด้วย (คาบเดี่ยว = นาทีต่อคาบ + 10 นาที)</p>
    <p class="wrap"><button class="btn pri" data-act="ptimeSave">บันทึก</button><button class="btn" data-act="mclose">ยกเลิก</button></p>`); },
  ptimeSave: () => run(async () => {
    const v = { dayStart: String($('#pH').value).padStart(2, '0') + ':' + String($('#pMi').value).padStart(2, '0'), periodMin: $('#pL').value, periods: $('#pN').value, breakAfter: $('#pB').value, breakMin: $('#pB').value ? $('#pM').value : '' };
    if (!/^\d{2}:\d{2}$/.test(v.dayStart)) return toast('ใส่เวลาเริ่มก่อน');
    if (!(+v.periodMin >= 10 && +v.periodMin <= 180)) return toast('นาทีต่อคาบต้องอยู่ระหว่าง 10–180');
    if (!(+v.periods >= 1 && +v.periods <= 15)) return toast('จำนวนคาบต้องอยู่ระหว่าง 1–15');
    if (+v.breakAfter >= +v.periods) v.breakAfter = '';
    mclose();
    for (const k of Object.keys(v)) if (String(T.boot.cfg[k] || '') !== String(v[k])) { await tapi('tCfg', { key: k, value: v[k] }); T.boot.cfg[k] = v[k]; }
    toast('บันทึกแล้ว'); draw(); }),
  pCount: d => run(async () => { const P = Math.max(1, Math.min(15, (+T.boot.cfg.periods || 9) + +d.d)); await tapi('tCfg', { key: 'periods', value: P }); T.boot.cfg.periods = String(P); draw(); }),
  subNew: () => modal(`<h3>เพิ่มวิชา</h3><label>รหัสวิชา</label><input class="full" id="aC"><label>ชื่อวิชา</label><input class="full" id="aN"><label>ห้องที่สอน</label><input class="full" id="aR" placeholder="เช่น 5/1, 5/2, 4/4+4/5">
    <p class="mut">คั่นด้วย , = แยกห้อง · ใช้ + = หลายห้องเรียนพร้อมกันในคาบเดียว<br>สัดส่วนเริ่มต้น 25:20:25:30 แก้ทีหลังได้</p><p class="wrap"><button class="btn pri" data-act="subAdd">เพิ่ม</button><button class="btn" data-act="mclose">ยกเลิก</button></p>`),
  subAdd: () => run(async () => { await tapi('tSubjectAdd', { code: $('#aC').value, name: $('#aN').value, rooms: $('#aR').value }); mclose(); toast('เพิ่มวิชาแล้ว'); await tLoad(); }),
  subDel: d => run(async () => { const sb = subj(d.id), n = T.boot.groups.filter(g => g.subjectId === d.id).length;
    const pass = await ask(`ลบวิชา "${sb.name}" พร้อมห้องเรียน ${n} กลุ่ม ช่องคะแนน คะแนน และข้อมูลเช็คชื่อทั้งหมดของวิชานี้ — กู้คืนไม่ได้`, { title: 'ลบวิชา', pass: true, danger: true, yes: 'ลบถาวร' });
    if (!pass) return; await tapi('tSubjectDel', { subjectId: d.id, pass }); toast('ลบวิชาแล้ว'); T.att = null; T.sg = null; await tLoad(); }),
  grpNew: d => modal(`<h3>เพิ่มห้อง — ${esc(subj(d.id).name)}</h3><label>ห้อง</label><input class="full" id="gR" placeholder="เช่น 5/3 หรือ 4/4+4/5"><p class="mut">ใช้ + ถ้าหลายห้องเรียนพร้อมกันในคาบเดียว · ใช้ , ถ้าเพิ่มหลายห้องแยกกัน</p>
    <p class="wrap"><button class="btn pri" data-act="grpAdd" data-id="${d.id}">เพิ่ม</button><button class="btn" data-act="mclose">ยกเลิก</button></p>`),

    if (!pass) return; await tapi('tGroupDel', { groupId: d.id, pass }); toast('ลบแล้ว'); T.att = null; T.sg = null; await tLoad(); }),

/* =================== เริ่มทำงาน =================== */
const BUSY = new Set();
function draw(){ document.body.classList.toggle('mode-T', MODE === 'T'); document.body.classList.toggle('mode-S', MODE !== 'T'); drawHeader(); $('#app').innerHTML = MODE === 'T' ? vTeacher() : vStudent(); loadImgs(); }
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return mclose();
  if (e.target.closest('#theme')) return setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  const el = e.target.closest('[data-act]'); if (!el) return;
  const f = TA[el.dataset.act] || SA[el.dataset.act]; if (!f) return;
  const key = [el.dataset.act, el.dataset.id || '', el.dataset.stu || '', el.dataset.k || '', el.dataset.st || ''].join('|');
  if (BUSY.has(key)) return;
  const r = f(el.dataset);
  if (r && typeof r.then === 'function') { BUSY.add(key); el.classList.add('busy'); el.setAttribute('aria-busy', 'true');
    r.finally(() => { BUSY.delete(key); el.classList.remove('busy'); el.removeAttribute('aria-busy'); }); }
});
let lastLeave = 0;
function quizLeft(){
  if (MODE !== 'S' || S.step !== 'quiz' || !S.qz || S.qz.data.done || Date.now() - lastLeave < 3000) return;
  lastLeave = Date.now();
  api('sQuizLeave', { token: LS.get('tok'), sessionId: S.qz.sessionId }, true).then(n => { if (n) S.qzLeaves = n; }).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.hidden) return quizLeft();
  if (MODE === 'S' && S.step === 'quiz' && S.qzLeaves && !S.qz.data.done) setTimeout(() => { draw(); toast('ระบบบันทึกว่าออกจากหน้าควิซแล้ว ' + S.qzLeaves + ' ครั้ง ครูจะเห็น'); }, 600); });
window.addEventListener('blur', quizLeft);
function bindQ(el){
  const ds = el.dataset || {};
  if (ds.qa && S.qa) { if (el.type !== 'radio' || el.checked) S.qa[ds.qa] = el.value; return; }
  if (!T.qz || T.more !== 'qedit' || MODE !== 'T') return;
  if (ds.qf) { T.qz[ds.qf] = el.value; return; }
  if (ds.qi == null || !ds.qk) return;
  const q = T.qz.qs[+ds.qi]; if (!q) return;
  if (ds.qk === 'choice') q.choices[+ds.ci] = el.value;
  else if (ds.qk === 'ans' && el.type === 'radio') { if (el.checked) q.ans = el.value; }
  else if (ds.qk === 'type') { if (q.type === el.value) return; q.type = el.value; if (el.value === 'mc') { q.choices = q.choices && q.choices.length >= 2 ? q.choices : ['', '', '', '']; q.ans = ''; }
    else if (el.value === 'num') { q.ans = ''; q.tol = 1; q.unit = ''; } else q.ans = ''; draw(); return; }
  else q[ds.qk] = el.value;
  if (ds.qk === 'pts') { const t = $('#qzTot'); if (t) t.textContent = T.qz.qs.reduce((a, x) => a + (+x.pts || 0), 0); }
}
document.addEventListener('change', e => { const el = e.target, ds = el.dataset || {}; bindQ(el);
  if (ds.up && el.files && el.files[0]) { SA.sUpload(ds.up, el.files[0]); el.value = ''; }
  if (ds.qimg != null && el.files && el.files[0]) { const f = el.files[0], i = +ds.qimg; el.value = ''; run(async () => { const data = await readImg(f); const r = await tapi('tUpload', { data }); IMG[r.fileId] = data; T.qz.qs[i].img = r.fileId; draw(); }); }
  if (ds.chg === 'qsub') { T.qsub = el.value; draw(); } });
document.addEventListener('input', e => { const el = e.target; bindQ(el); if (el.dataset && el.dataset.in === 'score' && T.draft && T.draft[el.dataset.stu]) T.draft[el.dataset.stu].score = el.value.trim(); });
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.tr && T.tg) return trChange(el); if (el.dataset && el.dataset.chg === 'gid') { T.gid = el.value; run(async () => { if (T.tab === 'att') { T.att = null; await attLoad(); } else if (T.tab === 'score') { T.sg = null; await scLoad(); } }); } });
setTheme(LS.get('theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
if (/PASTE_APPS_SCRIPT/.test(API_URL)) $('#app').innerHTML = '<div class="card">ยังไม่ได้ใส่ URL ของ Apps Script ในไฟล์ index.html (บรรทัด API_URL)</div>';
else if (MODE === 'T') { draw(); if (LS.get('tt')) tLoad(); } else sBoot();
</script>
